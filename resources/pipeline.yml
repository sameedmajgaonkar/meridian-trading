# The single pipeline resource.
# UC objects (catalog, schemas, volume) are created by sql/setup.
resources:
  pipelines:
    meridian_t02_pipeline:
      name: meridian_t02_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema_prefix}bronze
      serverless: true
      libraries:
        - file:
            path: ../src/pipeline/bronze.sql
        - file:
            path: ../src/pipeline/silver.sql
        - file:
            path: ../src/pipeline/customer_history.sql
        - file:
            path: ../src/pipeline/gold.sql
        - file:
            path: ../src/pipeline/ops.sql
      configuration:
        catalog: ${var.catalog}
        schema_prefix: ${var.schema_prefix}
        order_start_date: ${var.order_start_date}
        order_end_date: ${var.order_end_date}
