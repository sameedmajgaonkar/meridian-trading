resources:
  jobs:
    meridian_t02_job:
      name: meridian_t02_job
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            client: "6"
      tasks:
        - task_key: gov_setup
          sql_task:
            file:
              path: ../sql/governance/functions.sql
            parameters:
              catalog: ${var.catalog}
        - task_key: simulate_batch
          environment_key: default
          spark_python_task:
            python_file: ../src/landing/simulate.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--batch"
              - "${var.simulate_batch}"
        - task_key: pipeline_update
          depends_on:
            - task_key: gov_setup
            - task_key: simulate_batch
          pipeline_task:
            pipeline_id: ${resources.pipelines.meridian_t02_pipeline.id}
        - task_key: gov_apply
          depends_on:
            - task_key: pipeline_update
          sql_task:
            file:
              path: ../sql/governance/apply_policies.sql
            parameters:
              catalog: ${var.catalog}
        - task_key: metric_view
          depends_on:
            - task_key: pipeline_update
          sql_task:
            file:
              path: ../sql/metric_views/trading_metrics.sql
            parameters:
              catalog: ${var.catalog}
        - task_key: quality_gate
          depends_on:
            - task_key: gov_apply
            - task_key: metric_view
          environment_key: default
          spark_python_task:
            python_file: ../src/quality_gate/quality_gate.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--batch"
              - "${var.simulate_batch}"
      email_notifications:
        on_failure:
          - ${var.alert_email}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
