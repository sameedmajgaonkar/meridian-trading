resources:
  schemas:
    landing: {name: landing, catalog_name: "${var.catalog}", comment: Raw file drops}
    bronze: {name: bronze, catalog_name: "${var.catalog}", comment: Append-only source history}
    silver: {name: silver, catalog_name: "${var.catalog}", comment: Validated business records}
    gold: {name: gold, catalog_name: "${var.catalog}", comment: Governed facts and metrics}
    gov: {name: gov, catalog_name: "${var.catalog}", comment: Access rules and entitlements}
    ops: {name: ops, catalog_name: "${var.catalog}", comment: Quality and monitoring}
  volumes:
    raw_files:
      name: raw_files
      catalog_name: ${var.catalog}
      schema_name: landing
      volume_type: MANAGED
