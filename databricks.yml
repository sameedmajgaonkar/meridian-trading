bundle:
  name: meridian_t02
  databricks_cli_version: ">= 1.20.0"

variables:
  catalog:
    description: Target Unity Catalog for the lakehouse.
    default: meridian_t02
  warehouse:
    description: SQL Warehouse ID for SQL tasks.
    default: 7c433c4d75a98ff6
  alert_email:
    description: Job failure notification recipient.
    default: ${workspace.current_user.userName}
  batch:
    description: Landing batch to generate (1..3 or 'next').
    default: "next"

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - evidence/**
    - tests/**
    - "*.pdf"
    - "*.png"
