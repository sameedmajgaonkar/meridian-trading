bundle:
  name: meridian_t02
  databricks_cli_version: ">= 1.20.0"

variables:
  catalog:
    description: Target Unity Catalog for the lakehouse.
    default: meridian_t02
  order_start_date:
    description: Inclusive start date of the order window.
    default: "1995-01-01"
  order_end_date:
    description: Exclusive end date of the order window.
    default: "1996-01-01"
  alert_email:
    description: Job failure notification recipient.
    default: ${workspace.current_user.userName}
  simulate_batch:
    description: Landing batch to generate (1..3 or 'next').
    default: "next"

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
  prod:
    variables:
      catalog: meridian_t02_prod

sync:
  exclude:
    - evidence/**
    - tests/**
    - "*.pdf"
    - "*.png"
